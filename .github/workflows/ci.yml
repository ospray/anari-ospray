name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:

### BUILD JOBS ###

  build-arch:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ospray/docker-images:arch
      cmd: |
        .github/workflows/build.sh -G Ninja
      artifact-out: build-arch
      artifact-path: build/install

  build-arch-clang:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ospray/docker-images:arch
      cmd: |
        CC=clang CXX=clang++ .github/workflows/build.sh -G Ninja
      artifact-out: build-arch-clang
      artifact-path: build/install

  build-rocky8:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: rockylinux:8.7
      cmd: |
        .github/workflows/build.sh
      artifact-out: build-rocky8
      artifact-path: build/install

  build-ubuntu20_04:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:20.04
      cmd: |
        .github/workflows/build.sh -G Ninja
      artifact-out: build-ubuntu20_04
      artifact-path: build/install

  build-ubuntu22_04:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:22.04
      cmd: |
        .github/workflows/build.sh -G Ninja
      artifact-out: build-ubuntu22_04
      artifact-path: build/install

  build-next-ubuntu22_04:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:22.04
      cmd: |
        .github/workflows/build.sh -G Ninja -DBUILD_ANARI_CTS=ON -DANARI_SDK_VERSION=next_release # next_release for new anariCts CTS tool
      artifact-out: build-next-ubuntu22_04
      artifact-path: build/install

  build-osx:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/macos.yml@main
    with:
      cmd: |
        .github/workflows/build.sh
      artifact-out: build-osx
      artifact-path: build/install

  build-windows-clang:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/windows.yml@main
    secrets: inherit
    with:
      dpcpp-version: intel-llvm/nightly-2023-10-26-rk
      cmd: |
        $env:SYCL_BUNDLE_ROOT = $env:DPCPP_ROOT
        .github\workflows\build.ps1 -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl
      artifact-out: build-windows
      artifact-path: build/install

  build-windows-msvc16:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/windows.yml@main
    with:
      cmd: |
        .github\workflows\build.ps1 -G "Visual Studio 16 2019"
      artifact-out: build-windows-msvc16
      artifact-path: build/install

  build-windows-msvc17:
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/windows.yml@main
    with:
      cmd: |
        .github\workflows\build.ps1 -G "Visual Studio 17 2022"
      artifact-out: build-windows-msvc17
      artifact-path: build/install


###
### TEST JOBS ###

  test-arch:
    needs: build-arch
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ospray/docker-images:arch
      cmd: |
        .github/workflows/test.sh
      artifact-in: build-arch

  test-arch-clang:
    needs: build-arch-clang
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ospray/docker-images:arch
      cmd: |
        .github/workflows/test.sh
      artifact-in: build-arch-clang

  test-rocky8:
    needs: build-rocky8
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: rockylinux:8.7
      cmd: |
        .github/workflows/test.sh
      artifact-in: build-rocky8

  test-ubuntu20_04:
    needs: build-ubuntu20_04
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:20.04
      cmd: |
        .github/workflows/test.sh
      artifact-in: build-ubuntu20_04

  test-ubuntu22_04:
    needs: build-ubuntu22_04
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:22.04
      cmd: |
        .github/workflows/test.sh
      artifact-in: build-ubuntu22_04

  test-next-ubuntu22_04:
    needs: build-next-ubuntu22_04
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:22.04
      cmd: |
        .github/workflows/test.sh
      artifact-in: build-next-ubuntu22_04

  cts-ubuntu22_04:
    needs: build-next-ubuntu22_04
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:22.04
      cmd: |
        python3 -m pip install --quiet reportlab # install reportlab into the python3 that runs ctsReport.py
        export LD_LIBRARY_PATH=$PWD/build/install/lib:$PWD/build/install/lib64:$LD_LIBRARY_PATH
        WD="$GITHUB_WORKSPACE/cts-report"
        ./build/install/bin/anariCts generate --workdir "$WD" # generate helide ground truth
        ./build/install/bin/anariCts run ospray --workdir "$WD" || true # allow to fail
        ./build/install/bin/anariCts report "$WD" --html "$WD/cts-report.html" || true # interactive HTML report
        python3 build/install/share/anari/cts/ctsReport.py report "$WD" --pdf "$WD/cts-report.pdf" || true # allow failure
      artifact-in: build-next-ubuntu22_04
      artifact-out: cts-report
      artifact-path: cts-report

  cts-scivis-ubuntu22_04:
    needs: build-next-ubuntu22_04
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/docker.yml@main
    with:
      image: ubuntu:22.04
      cmd: |
        python3 -m pip install --quiet reportlab # install reportlab into the python3 that runs ctsReport.py
        export LD_LIBRARY_PATH=$PWD/build/install/lib:$PWD/build/install/lib64:$LD_LIBRARY_PATH
        WD="$GITHUB_WORKSPACE/cts-report-scivis"
        ./build/install/bin/anariCts generate --workdir "$WD" # generate helide ground truth
        ./build/install/bin/anariCts run ospray --renderer scivis --workdir "$WD" || true # run scivis renderer, allow to fail
        ./build/install/bin/anariCts report "$WD" --html "$WD/cts-report.html" || true # interactive HTML report
        python3 build/install/share/anari/cts/ctsReport.py report "$WD" --pdf "$WD/cts-report.pdf" || true # allow failure
      artifact-in: build-next-ubuntu22_04
      artifact-out: cts-report-scivis
      artifact-path: cts-report-scivis

  test-osx:
    needs: build-osx
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/macos.yml@main
    with:
      cmd: |
        .github/workflows/test.sh
        export DYLD_FALLBACK_LIBRARY_PATH=./build/install/lib
        export ANARI_LIBRARY=ospray
        ./build/install/bin/anariRenderTests
      artifact-in: build-osx

  test-windows-msvc16:
    needs: build-windows-msvc16
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/windows.yml@main
    with:
      cmd: |
        $env:ANARI_LIBRARY="ospray"
        ./build/install/bin/anariRenderTests
      artifact-in: build-windows-msvc16

  test-windows-msvc17:
    needs: build-windows-msvc17
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/windows.yml@main
    with:
      cmd: |
        $env:ANARI_LIBRARY="ospray"
        ./build/install/bin/anariRenderTests
      artifact-in: build-windows-msvc17


###
### SCAN JOBS ###

  static-analysis:
    secrets: inherit
    uses: intel-innersource/libraries.devops.renderkit.workflows/.github/workflows/static_analysis.yml@main
    with:
      project: ANARI OSPRay
      server: prod4
      prebuild: >
        cmake -DCMAKE_INSTALL_PREFIX=install -L -S ./superbuild -B build &&
        cmake --build build --parallel --target anari ospray
      build: cmake --build build --parallel --target anari-ospray

